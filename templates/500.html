<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - DocBook</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4ff;color:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
        .card{background:#fff;border-radius:20px;padding:48px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.06);animation:fadeInUp .5s ease-out}
        .code{font-size:5rem;font-weight:800;color:#dc2626;line-height:1;margin-bottom:12px}
        h1{font-size:1.25rem;font-weight:700;margin-bottom:8px}
        p{color:#5a6178;line-height:1.6;margin-bottom:32px}
        .btn{display:inline-block;padding:12px 24px;border-radius:10px;font-weight:600;font-size:.9rem;text-decoration:none;background:#0f6bff;color:#fff;transition:background .2s,transform .2s}
        .btn:hover{background:#0a4dcc;transform:translateY(-1px)}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
        @media(prefers-reduced-motion:reduce){.card{animation:none}}
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <h1>Server Error</h1>
        <p>Something went wrong on our end. Please try again later. If the problem persists, contact support.</p>
        <a href="/" class="btn">Go to Home</a>
    </div>
</body>
</html>
